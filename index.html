<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KittyMart</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffd9e8">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd9e8;font-family:ui-rounded,'Nunito',system-ui,sans-serif;color:#5a3a3a;touch-action:none}
#app{position:absolute;left:0;top:0;width:420px;height:760px;transform-origin:0 0;overflow:hidden}
canvas#c{position:absolute;left:0;top:0;width:420px;height:760px;display:block}
.pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.94);border:2.5px solid #ff9fbf;border-radius:999px;padding:3px 12px 3px 6px;font-weight:800;font-size:16px;color:#7a3b52;box-shadow:0 2px 6px rgba(120,60,80,.2)}
#hud{position:absolute;left:8px;top:8px;right:8px;display:none;gap:8px;align-items:center}
#hud .sp{flex:1}
.rb{width:36px;height:36px;border-radius:50%;border:2.5px solid #59cdbd;background:#fff;color:#2a7f73;font:800 19px ui-rounded,system-ui;padding:0;cursor:pointer;box-shadow:0 2px 6px rgba(120,60,80,.2)}
#nav{position:absolute;left:0;right:0;bottom:8px;display:none;justify-content:center;gap:8px;padding:0 8px}
.nb{flex:1;max-width:96px;height:58px;border-radius:18px;border:2.5px solid #59cdbd;background:rgba(255,255,255,.96);color:#2a6f65;font:800 12px ui-rounded,system-ui;cursor:pointer;line-height:1.1;box-shadow:0 3px 8px rgba(120,60,80,.2)}
.nb span{display:block;font-size:23px}
.nb:active{transform:scale(.95)}
#act{position:absolute;right:16px;bottom:26px;width:94px;height:94px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#ffd0e0,#ff7fa8);color:#fff;font:800 18px ui-rounded,system-ui;display:none;box-shadow:0 6px 16px rgba(160,50,90,.45);text-shadow:0 1px 3px rgba(120,30,70,.55);cursor:pointer}
#act:active{transform:scale(.94)}
#lure{position:absolute;left:14px;bottom:44px;display:none;border:3px solid #fff;border-radius:999px;padding:10px 16px;background:linear-gradient(#a8f3e6,#4cc9b3);color:#0b4b42;font:800 16px ui-rounded,system-ui;box-shadow:0 5px 14px rgba(40,120,110,.4);cursor:pointer}
#back{position:absolute;right:8px;top:50px;display:none;border:2.5px solid #59cdbd;background:#fff;color:#2a6f65;border-radius:14px;padding:6px 12px;font:800 14px ui-rounded,system-ui;cursor:pointer}
#toast{position:absolute;left:50%;top:372px;transform:translateX(-50%);opacity:0;transition:opacity .3s;pointer-events:none;background:#fff;border:2.5px solid #ff9fbf;color:#7a3b52;border-radius:16px;padding:8px 14px;font-weight:800;font-size:15px;text-align:center;max-width:380px;z-index:30;box-shadow:0 4px 12px rgba(120,60,80,.25)}
#catchui{position:absolute;left:24px;right:24px;top:120px;display:none;background:rgba(255,255,255,.95);border:3px solid #ff9fbf;border-radius:22px;padding:12px 14px 14px;text-align:center;z-index:15;box-shadow:0 8px 24px rgba(120,60,80,.3)}
#ct{font-weight:800;font-size:15px;color:#7a3b52;margin-bottom:8px}
#cbar{position:relative;height:36px;border-radius:18px;background:#ffe0ea;border:3px solid #fff;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.18);cursor:pointer}
#czone{position:absolute;top:0;bottom:0;background:linear-gradient(#b2f5bc,#4cc26f);border-radius:14px}
#cmark{position:absolute;top:-2px;bottom:-2px;width:9px;margin-left:-4px;background:#e2406f;border-radius:4px;box-shadow:0 0 6px rgba(226,64,111,.7)}
#pounce{margin-top:10px;width:100%;border:3px solid #fff;border-radius:16px;padding:10px;font:800 20px ui-rounded,system-ui;color:#fff;background:linear-gradient(#ff9cc4,#e26a9f);box-shadow:0 4px 12px rgba(160,50,90,.35);cursor:pointer}
#modal{position:absolute;inset:0;background:rgba(120,70,100,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
#mbox{position:relative;background:#fff8f0;border:3px solid #59cdbd;border-radius:24px;width:100%;max-height:92%;overflow:auto;padding:14px 14px 16px;touch-action:pan-y;color:#5a3a3a;box-shadow:0 10px 30px rgba(80,40,70,.4)}
#mbox h2{margin:0 0 10px;font-size:22px;color:#e0618b;padding-right:34px}
#mbox p{margin:0 0 8px;font-size:14px;font-weight:600}
#mx{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:#ffd9e8;color:#a8456b;font-size:18px;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;background:#ffeef4;border-radius:16px;padding:8px;margin-bottom:8px}
.row canvas{background:#fff;border:2px solid #ffd0e0;border-radius:12px;flex:none}
.meta{flex:1;min-width:0;font-weight:800;font-size:14px}
.meta small{display:block;font-weight:600;opacity:.75;font-size:12px;margin:2px 0}
.meta input,.meta select{font:700 16px ui-rounded,system-ui;width:100%;border:2px solid #ffc2d6;border-radius:9px;background:#fff;color:#5a3a3a;padding:3px 6px;margin-top:3px;user-select:text;-webkit-user-select:text}
.mood{height:9px;background:#ffe0ea;border-radius:5px;overflow:hidden;margin:3px 0}.mood i{display:block;height:100%;background:linear-gradient(90deg,#ff9fbf,#59cdbd)}
.mini{border:0;border-radius:12px;padding:8px 10px;font:800 13px ui-rounded,system-ui;background:#ffb454;color:#5a2d00;cursor:pointer;flex:none}
.mini.t{background:#59cdbd;color:#0b3d36}
.mini:disabled{opacity:.4}
.col{display:flex;flex-direction:column;gap:6px}
.big{display:block;width:100%;margin-top:8px;border:0;border-radius:16px;padding:12px;font:800 17px ui-rounded,system-ui;background:#59cdbd;color:#0b3d36;cursor:pointer}
.big.alt{background:#ffb454;color:#5a2d00}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:2.5px solid #59cdbd;background:#fff;color:#2a6f65;border-radius:14px;padding:7px;font:800 14px ui-rounded,system-ui;cursor:pointer}
.tabs button.on{background:#59cdbd;color:#0b3d36}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.dx{text-align:center;font-size:11px;font-weight:800;background:#ffeef4;border-radius:12px;padding:4px 2px}
.dx canvas{width:100%;height:auto}.dx.lock canvas{filter:brightness(0) opacity(.35)}
.dx small{display:block;font-weight:600;opacity:.75}
.stat{display:flex;gap:8px;margin-bottom:10px}.stat div{flex:1;background:#fff;border:2px solid #ffd0e0;border-radius:12px;padding:6px 4px;text-align:center;font-weight:800;font-size:18px;color:#e0618b}.stat small{display:block;font-size:11px;color:#7a5a5a;font-weight:700}
.steps .row{align-items:flex-start}.steps .ic{font-size:30px;width:40px;text-align:center;flex:none}
.acc{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.acc button{border:2.5px solid #ffc2d6;background:#fff;border-radius:14px;padding:8px 4px;font:800 13px ui-rounded,system-ui;color:#5a3a3a;cursor:pointer}
.acc button.on{border-color:#59cdbd;background:#e0fbf6}
.acc button span{display:block;font-size:24px}
#title{position:absolute;inset:0;background:linear-gradient(#bfe6ff,#ffd9e8 62%,#fff0d8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;z-index:25}
#title p{margin:0;max-width:330px;font-size:15px;font-weight:700;color:#7a4a5a}
#title input{font:800 18px ui-rounded,system-ui;text-align:center;border:3px solid #59cdbd;border-radius:999px;padding:8px 16px;width:240px;background:#fff;color:#5a3a3a;user-select:text;-webkit-user-select:text}
.go{font:800 22px ui-rounded,system-ui;border:4px solid #fff;border-radius:999px;padding:10px 40px;color:#5a2d00;background:linear-gradient(#ffd27a,#ffa04a);cursor:pointer;box-shadow:0 5px 14px rgba(160,90,40,.35)}
.go.alt{background:linear-gradient(#a8f3e6,#4cc9b3);color:#0b3d36;font-size:17px;padding:8px 28px}
</style>
</head>
<body>
<div id="app">
 <canvas id="c" width="420" height="760"></canvas>
 <div id="hud"><div class="pill"><canvas id="ci" width="28" height="28"></canvas><span id="coins">0</span></div><div class="pill">🐟 <span id="treats">0</span></div><div class="sp"></div><button class="rb" id="hb" title="How to play">❓</button><div class="pill" id="day">Day 1</div></div>
 <button id="back">🏠 Home</button>
 <div id="nav">
  <button class="nb" data-m="yard"><span>🌳</span>Cat Yard</button>
  <button class="nb" data-m="cats"><span>🐱</span>Cat-alog</button>
  <button class="nb" data-m="upg"><span>🛒</span>Upgrades</button>
  <button class="nb" data-m="set"><span>⚙️</span>Settings</button>
 </div>
 <button id="lure">🐟 Lure</button>
 <button id="act">✋<br>Act</button>
 <div id="catchui"><div id="ct">Tap when the marker is in the green!</div><div id="cbar"><div id="czone"></div><div id="cmark"></div></div><button id="pounce">🐾 Pounce!</button></div>
 <div id="toast"></div>
 <div id="modal"><div id="mbox"><button id="mx">✕</button><div id="mc"></div></div></div>
 <div id="title">
  <img id="logoimg" alt="KittyMart" width="330" height="330" style="width:330px;height:330px;border-radius:28px;box-shadow:0 8px 28px rgba(120,60,80,.35);object-fit:cover">
  <p>Run the cutest cat shop. Find shy cats hiding in the yard and win them over!</p>
  <input id="nm" type="text" maxlength="14" placeholder="Shopkeeper name" autocomplete="off">
  <button class="go" id="start">Open for business</button>
  <button class="go alt" id="cont" style="display:none">Continue</button>
 </div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),app=$('app');
const DW=420,DH=760,OUT='#7a4a38';
function fit(){const sc=Math.min(innerWidth/DW,innerHeight/DH);app.style.transform='translate('+(innerWidth-DW*sc)/2+'px,'+(innerHeight-DH*sc)/2+'px) scale('+sc+')';app._sc=sc;app._ox=(innerWidth-DW*sc)/2;app._oy=(innerHeight-DH*sc)/2}
addEventListener('resize',fit);fit();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>clamp(v+amt,0,255);return 'rgb('+f(n>>16)+','+f((n>>8)&255)+','+f(n&255)+')'}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,6.2832)}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fs(c,lw){c.fill();c.strokeStyle=OUT;c.lineWidth=lw||2.4;c.lineJoin='round';c.stroke()}

/* ---------- data ---------- */
const COATS=[
{id:'ginger',n:'Ginger Tabby',r:0,base:'#f6b571',pat:'tabby',pc:'#d98440',belly:'#fff3de'},
{id:'smoke',n:'Smoky Tabby',r:0,base:'#b9bfd2',pat:'tabby',pc:'#8c93ad',belly:'#eef0f7'},
{id:'shadow',n:'Shadow Black',r:0,base:'#5b5575',pat:'solid',pc:'#5b5575',belly:'#7a7396'},
{id:'cloud',n:'Cloud White',r:0,base:'#fffaf3',pat:'solid',pc:'#efe6da',belly:'#ffffff'},
{id:'tux',n:'Tuxedo',r:1,base:'#4f4c68',pat:'tux',pc:'#ffffff',belly:'#ffffff'},
{id:'calico',n:'Calico',r:1,base:'#fff6ea',pat:'calico',pc:'#f6b571',pc2:'#5b5575',belly:'#ffffff'},
{id:'siamese',n:'Siamese',r:1,base:'#f8e9d0',pat:'point',pc:'#9a6f5c',belly:'#fff6e6'},
{id:'bengal',n:'Golden Bengal',r:2,base:'#f5cc6e',pat:'spots',pc:'#a8682c',belly:'#fff5d6'},
{id:'starry',n:'Starry Night',r:2,base:'#51519a',pat:'stars',pc:'#ffeaa6',belly:'#6c6cb8'}];
const COAT={};COATS.forEach(k=>COAT[k.id]=k);
const RAR=['Common','Uncommon','Rare'],ZONE=[.36,.25,.16],COIN=[10,25,60];
const EYES=['#7fd6a8','#ffd36e','#7cc7f2','#f0a35e'],COLLARS=['#ff7fa8','#5db7e8','#ffc94d','#7bd389'];
const NAMES=['Miso','Pixel','Noodle','Biscuit','Mochi','Pepper','Waffles','Luna','Tofu','Ziggy','Olive','Nutmeg','Sprout','Pudding','Clove','Fig'];
const ACCS=[
{id:'cap',slot:'hat',n:'Teal cap',e:'🧢',cost:30},{id:'party',slot:'hat',n:'Party hat',e:'🎉',cost:40},{id:'crown',slot:'hat',n:'Golden crown',e:'👑',cost:90},{id:'flower',slot:'hat',n:'Flower',e:'🌸',cost:25},
{id:'bow',slot:'neck',n:'Bow tie',e:'🎀',cost:25},{id:'scarf',slot:'neck',n:'Cozy scarf',e:'🧣',cost:35},
{id:'glasses',slot:'face',n:'Sunglasses',e:'🕶️',cost:45},{id:'hearts',slot:'face',n:'Heart glasses',e:'💖',cost:55}];
const DIST=[
{id:'alley',n:'Back Alley',e:'🧱',cost:0,sub:'Sunny cobbled lane · common & uncommon cats',pool:['ginger','smoke','shadow','cloud','ginger','smoke','tux','calico'],props:[['bush',70,430],['box',335,400],['tree',215,520],['bush',350,610],['box',70,625]]},
{id:'pier',n:'Fish Pier',e:'⚓',cost:150,sub:'Seaside docks · Siamese & Bengal appear',pool:['smoke','shadow','cloud','tux','calico','siamese','siamese','bengal'],props:[['barrel',70,420],['box',335,440],['tree',215,540],['barrel',345,615],['bush',75,625]]},
{id:'roof',n:'Rooftops',e:'🌙',cost:400,sub:'Rooftop garden · Starry Night cats prowl',pool:['tux','calico','siamese','bengal','bengal','starry','starry','shadow'],props:[['chimney',75,430],['bush',335,420],['tree',215,545],['chimney',345,615],['box',70,630]]}];
const ITEMS=[{e:'🐟',p:6},{e:'🧶',p:9},{e:'🥫',p:12},{e:'🧸',p:16},{e:'🎀',p:24}];
const POSTS=[{n:'Counter greeter',d:'+25% tips',x:300,y:480},{n:'Window sunbather',d:'Customers arrive faster',x:90,y:282},{n:'Shelf napper',d:'Customers wait longer',x:372,y:282},{n:'Floor mouser',d:'Serves a customer every 9s',x:120,y:655}];
const QX=[300,230,160],FLOORY=612,TREAT=6;
const FX0=24,FX1=396,FY0=318,FY1=650;

/* ---------- state ---------- */
const KEY='kittymart-v1';
const fresh=()=>({name:'',coins:40,treats:5,cats:[],posts:[null,null,null,null],up:{shelf:0,neon:0,heat:0,rooms:2},seen:{},caught:{},acc:{},dist:{alley:1},served:0,nid:1,snd:1,helped:0});
let S=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object'){S=Object.assign(fresh(),s);S.up=Object.assign(fresh().up,s.up||{});S.dist=Object.assign({alley:1},s.dist||{});S.acc=s.acc||{};S.caught=s.caught||{};if(s.tut&&!s.helped)S.helped=1}}catch(e){}
S.cats.forEach(c=>{if(!c.wear)c.wear={}});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let hasSave=false;try{hasSave=!!localStorage.getItem(KEY)&&!!S.name}catch(e){}

/* ---------- sound ---------- */
let AC=null;
function sfx(f,d,type,v,delay){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(delay||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}

/* ---------- drawing: cats ---------- */
function star(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath();c.fill()}
function heart(c,x,y,r){c.beginPath();c.moveTo(x,y+r*.9);c.bezierCurveTo(x-r*1.5,y-r*.2,x-r*.8,y-r*1.2,x,y-r*.4);c.bezierCurveTo(x+r*.8,y-r*1.2,x+r*1.5,y-r*.2,x,y+r*.9);c.closePath()}
function drawAcc(c,W,hy){
 if(W.neck==='bow'){c.fillStyle='#ff5a7a';c.beginPath();c.moveTo(0,hy+28);c.lineTo(-13,hy+20);c.lineTo(-13,hy+36);c.closePath();fs(c,2);c.beginPath();c.moveTo(0,hy+28);c.lineTo(13,hy+20);c.lineTo(13,hy+36);c.closePath();fs(c,2);c.fillStyle='#e03a5e';rr(c,-4,hy+23,8,10,3);fs(c,2)}
 if(W.neck==='scarf'){c.strokeStyle=OUT;c.lineWidth=12;c.lineCap='round';c.beginPath();c.moveTo(-20,hy+22);c.quadraticCurveTo(0,hy+36,20,hy+22);c.stroke();c.strokeStyle='#ff9a5c';c.lineWidth=8;c.stroke();c.fillStyle='#ff9a5c';rr(c,8,hy+26,10,24,4);fs(c,2);c.strokeStyle='#ffd0a0';c.lineWidth=2;c.beginPath();c.moveTo(10,hy+34);c.lineTo(16,hy+34);c.moveTo(10,hy+42);c.lineTo(16,hy+42);c.stroke()}
 if(W.face==='glasses'){c.fillStyle='rgba(40,34,60,.92)';[-12,12].forEach(x=>{ell(c,x,hy,10.5,9.5);c.fill();c.strokeStyle='#e8b84a';c.lineWidth=2.4;c.stroke()});c.strokeStyle='#e8b84a';c.lineWidth=2.4;c.beginPath();c.moveTo(-2,hy-1);c.lineTo(2,hy-1);c.stroke();c.fillStyle='rgba(255,255,255,.7)';ell(c,-15,hy-3,2.6,1.6,-.5);c.fill();ell(c,9,hy-3,2.6,1.6,-.5);c.fill()}
 if(W.face==='hearts'){c.fillStyle='#ff7fa8';[-12,12].forEach(x=>{heart(c,x,hy-1,10);fs(c,2)});c.strokeStyle=OUT;c.lineWidth=2;c.beginPath();c.moveTo(-3,hy-3);c.lineTo(3,hy-3);c.stroke();c.fillStyle='rgba(255,255,255,.75)';ell(c,-15,hy-4,2.4,1.5,-.5);c.fill();ell(c,9,hy-4,2.4,1.5,-.5);c.fill()}
 if(W.hat==='cap'){c.fillStyle='#59cdbd';c.beginPath();c.moveTo(-24,hy-20);c.bezierCurveTo(-24,hy-48,24,hy-48,24,hy-20);c.closePath();fs(c);rr(c,6,hy-27,30,8,4);fs(c,2.2);c.fillStyle='#fff';ell(c,-4,hy-34,6,3);c.fill();c.beginPath();c.moveTo(-10,hy-34);c.lineTo(-14,hy-37);c.lineTo(-14,hy-31);c.closePath();c.fill()}
 if(W.hat==='party'){c.save();c.rotate(.12);c.fillStyle='#ffd35c';c.beginPath();c.moveTo(-15,hy-21);c.lineTo(15,hy-21);c.lineTo(0,hy-62);c.closePath();fs(c);c.fillStyle='#ff7fa8';star(c,0,hy-36,5);star(c,-6,hy-27,3);c.fillStyle='#ff7fa8';c.beginPath();c.arc(0,hy-63,5,0,6.3);fs(c,2);c.restore()}
 if(W.hat==='crown'){c.fillStyle='#ffd24a';c.beginPath();c.moveTo(-17,hy-20);c.lineTo(-19,hy-44);c.lineTo(-9,hy-33);c.lineTo(0,hy-48);c.lineTo(9,hy-33);c.lineTo(19,hy-44);c.lineTo(17,hy-20);c.closePath();fs(c);c.fillStyle='#ff5a7a';c.beginPath();c.arc(0,hy-28,3.4,0,6.3);c.fill();c.fillStyle='#7cc7f2';c.beginPath();c.arc(-9,hy-26,2.4,0,6.3);c.arc(9,hy-26,2.4,0,6.3);c.fill()}
 if(W.hat==='flower'){c.save();c.translate(-22,hy-22);c.fillStyle='#ffa8c8';for(let i=0;i<5;i++){c.save();c.rotate(i*1.2566);ell(c,0,-7,5,6.5);fs(c,1.8);c.restore()}c.fillStyle='#ffd35c';c.beginPath();c.arc(0,0,4,0,6.3);fs(c,1.8);c.restore()}
}
function drawCat(c,x,y,o){
 const K=COAT[o.coat],s=o.s||1,t=o.t||0,m=o.mood||'idle',eye=o.eye||'#7fd6a8',W=o.wear||{},A=o.alpha!=null?o.alpha:1;

$('mx').onclick=closeModal;
function openHelp(){
 modal('<h2>How to play 🐾</h2><div class="steps"><div class="row"><div class="ic">🛍️</div><div class="meta">Run the shop<small>Tap customers waiting at the counter to serve them and earn KittyCoins.</small></div></div><div class="row"><div class="ic">🌳</div><div class="meta">Visit the Cat Yard<small>Tap the ground (or use WASD / arrows) to walk. Shy cats loaf around — or hide in bushes and boxes. Press ✋ Act beside a bush to look inside!</small></div></div><div class="row"><div class="ic">🐟</div><div class="meta">Lure, then pounce<small>Walk up beside a cat and press ✋ Act to lure it with a treat or toy. Sneak up while its eyes are closed 😌 for a bigger target; freeze when it watches 👀. Then tap Pounce when the marker is in the green!</small></div></div><div class="row"><div class="ic">👑</div><div class="meta">Care & dress up<small>Give your cats shop jobs in the Cat-alog, feed them, and buy hats, bows and scarves. Fill your Diary with all 9 coats!</small></div></div></div><button class="big" id="hok">Let\'s play!</button>');
 $('hok').onclick=closeModal;
}
function coatName(id){return S.seen[id]?COAT[id].n:'???'}
function openCats(keep){
 let h='<h2>Cat-alog</h2><div class="tabs"><button class="'+(catTab==='cats'?'on':'')+'" data-tab="cats">🐱 My cats</button><button class="'+(catTab==='diary'?'on':'')+'" data-tab="diary">📖 Diary</button></div>';
 if(catTab==='diary'){
  const found=COATS.filter(k=>S.seen[k.id]).length,tot=Object.values(S.caught).reduce((a,b)=>a+b,0);
  h+='<div class="stat"><div>'+found+'/9<small>coats found</small></div><div>'+Math.max(tot,S.cats.length)+'<small>cats befriended</small></div><div>'+S.served+'<small>customers served</small></div></div><div class="dex">';
  COATS.forEach(k=>{const got=S.seen[k.id];h+='<div class="dx '+(got?'':'lock')+'"><canvas width="90" height="100" data-dex="'+k.id+'"></canvas>'+(got?k.n:'???')+'<small>'+(got?'Met ×'+(S.caught[k.id]||1)+' · ':'')+'⭐'.repeat(k.r+1)+'</small></div>'});
  h+='</div>';
 }else{
  if(!S.cats.length)h+='<p>No cats yet — visit the Cat Yard and win some over!</p>';
  S.cats.forEach(c=>{const K=COAT[c.coat],job=S.posts.indexOf(c.id);
   h+='<div class="row"><canvas width="90" height="110" data-cat="'+c.id+'"></canvas><div class="meta"><input type="text" maxlength="12" value="'+esc(c.name)+'" data-ren="'+c.id+'"><small>'+K.n+' · '+RAR[K.r]+'</small><div class="mood"><i style="width:'+Math.round(c.mood)+'%"></i></div><select data-job="'+c.id+'"><option value="-1">Resting</option>'+POSTS.slice(0,S.up.rooms).map((p,i)=>'<option value="'+i+'"'+(job===i?' selected':'')+'>'+p.n+'</option>').join('')+'</select></div><div class="col"><button class="mini" data-feed="'+c.id+'"'+(S.treats<1?' disabled':'')+'>🐟 Feed</button><button class="mini t" data-dress="'+c.id+'">👗 Dress</button></div></div>'});
 }
 modal(h);const mb=$('mbox');if(keep)mb.scrollTop=keep;
 mb.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{catTab=e.dataset.tab;openCats()});
 mb.querySelectorAll('[data-dex]').forEach(e=>paint(e,(c,w,hh)=>{c.translate(w/2-8,hh-8);drawCat(c,0,0,{coat:e.dataset.dex,s:.68,mood:'idle'})}));
 mb.querySelectorAll('[data-cat]').forEach(e=>{const k=catBy(+e.dataset.cat);paint(e,(c,w,hh)=>{c.translate(w/2-6,hh-8);drawCat(c,0,0,{coat:k.coat,eye:k.eye,collar:k.collar,wear:k.wear,s:.74,mood:'idle'})})});
 mb.querySelectorAll('[data-ren]').forEach(e=>e.onchange=()=>{const k=catBy(+e.dataset.ren);k.name=e.value.trim().slice(0,12)||k.name;save()});
 mb.querySelectorAll('[data-job]').forEach(e=>e.onchange=()=>{const id=+e.dataset.job,j=+e.value;S.posts=S.posts.map(p=>p===id?null:p);if(j>=0)S.posts[j]=id;save();openCats(mb.scrollTop)});
 mb.querySelectorAll('[data-feed]').forEach(e=>e.onclick=()=>{if(S.treats<1)return;const k=catBy(+e.dataset.feed);S.treats--;k.mood=100;sfx(700,.1,'triangle');refresh();save();openCats(mb.scrollTop)});
 mb.querySelectorAll('[data-dress]').forEach(e=>e.onclick=()=>openDress(+e.dataset.dress));
}
function openDress(id){
 const k=catBy(id);if(!k)return;
 let h='<h2>Dress up '+esc(k.name)+' 👗</h2><div style="text-align:center"><canvas id="dp" width="220" height="200" style="background:#fff;border:2px solid #ffd0e0;border-radius:16px"></canvas></div><p style="margin-top:8px">Tap to wear or remove. You have '+S.coins+' 🪙.</p><div class="acc">';
 ACCS.forEach(a=>{const own=S.acc[a.id],on=k.wear[a.slot]===a.id;h+='<button data-a="'+a.id+'" class="'+(on?'on':'')+'"><span>'+a.e+'</span>'+a.n+'<br><small>'+(on?'Wearing ✓':own?'Owned':'🪙 '+a.cost)+'</small></button>'});
 h+='</div><button class="big alt" id="dback">← Back to Cat-alog</button>';
 modal(h);let tt=0;const anim=()=>{if(!$('dp'))return;tt+=.04;paint($('dp'),(c,w,hh)=>{c.translate(w/2,hh-14);drawCat(c,0,0,{coat:k.coat,eye:k.eye,collar:k.collar,wear:k.wear,s:1.5,t:tt,mood:'idle'})});requestAnimationFrame(anim)};anim();
 const mb=$('mbox');
 mb.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{const a=ACCS.find(x=>x.id===e.dataset.a);
  if(k.wear[a.slot]===a.id){delete k.wear[a.slot]}
  else{if(!S.acc[a.id]){if(S.coins<a.cost){toast('Not enough 🪙 yet');return}S.coins-=a.cost;S.acc[a.id]=1;sfx(1000,.15,'triangle');refresh()}k.wear[a.slot]=a.id;sfx(780,.1,'triangle')}
  save();const st=mb.scrollTop;openDress(id);$('mbox').scrollTop=st});
 $('dback').onclick=()=>openCats();
}
function upgList(){const u=S.up;return[
 {n:'🛍️ Stock more goods',d:'Unlock new items & higher prices',lv:u.shelf,max:3,cost:[60,160,380][u.shelf],buy(){u.shelf++}},
 {n:'💡 Neon sign',d:'Customers arrive faster',lv:u.neon,max:3,cost:[50,140,320][u.neon],buy(){u.neon++}},
 {n:'🔥 Heated floor',d:'Cats stay happy longer',lv:u.heat,max:3,cost:[40,120,280][u.heat],buy(){u.heat++}},
 {n:'🪜 Cat perch',d:'Unlock another job post',lv:u.rooms-2,max:2,cost:[120,300][u.rooms-2],buy(){u.rooms++}}]}
function openUpg(){
 let h='<h2>Shop upgrades</h2><div class="row"><div class="meta">🐟 Fish treats ×'+S.treats+'<small>'+TREAT+' 🪙 each — lure cats in the yard, or feed them</small></div><button class="mini" data-t="1"'+(S.coins<TREAT*3?' disabled':'')+'>Buy ×3 · '+TREAT*3+'🪙</button></div>';
 upgList().forEach((x,i)=>{const maxed=x.lv>=x.max;h+='<div class="row"><div class="meta">'+x.n+' <small>'+x.d+' · Lv '+x.lv+'/'+x.max+'</small></div><button class="mini" data-u="'+i+'"'+(maxed||S.coins<x.cost?' disabled':'')+'>'+(maxed?'Maxed':x.cost+'🪙')+'</button></div>'});
 modal(h);const mb=$('mbox');
 mb.querySelector('[data-t]').onclick=()=>{if(S.coins<TREAT*3)return;S.coins-=TREAT*3;S.treats+=3;sfx(700,.1,'triangle');refresh();save();openUpg()};
 mb.querySelectorAll('[data-u]').forEach(e=>e.onclick=()=>{const x=upgList()[+e.dataset.u];if(x.lv>=x.max||S.coins<x.cost)return;S.coins-=x.cost;x.buy();sfx(1000,.15,'triangle');refresh();save();openUpg()});
}
function openYard(){
 let h='<h2>Cat Yard 🌳</h2><p>Walk up to a cat, lure it with a 🐟 treat or free 🧶 toy, then pounce! Cats hide in bushes and boxes — press ✋ Act beside one to peek.</p>';
 DIST.forEach((D,i)=>{const own=S.dist[D.id];h+='<div class="row"><div style="font-size:30px">'+D.e+'</div><div class="meta">'+D.n+'<small>'+D.sub+'</small></div><button class="mini" data-d="'+i+'"'+(!own&&S.coins<D.cost?' disabled':'')+'>'+(own?'Go':'Unlock '+D.cost+'🪙')+'</button></div>'});
 modal(h);
 $('mbox').querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{const i=+e.dataset.d,D=DIST[i];if(!S.dist[D.id]){if(S.coins<D.cost)return;S.coins-=D.cost;S.dist[D.id]=1;refresh();save();openYard();return}startYard(i)});
}
function openSet(){
 modal('<h2>Settings</h2><div class="row"><div class="meta">Sound<small>Little beeps and chimes</small></div><button class="mini" id="sn">'+(S.snd?'On':'Off')+'</button></div><div class="row"><div class="meta">How to play<small>Replay the quick guide</small></div><button class="mini t" id="hp">❓ Show</button></div><div class="row"><div class="meta">Shop: '+esc(S.name||'KittyMart')+'<small>'+S.served+' customers served · '+S.cats.length+' cats</small></div></div><div class="row"><div class="meta">Title logo<small>Seasonal KittyMart art</small></div><select id="lg" style="width:130px;font:700 16px ui-rounded,system-ui;border:2px solid #ffc2d6;border-radius:9px;background:#fff;color:#5a3a3a;padding:3px 6px">'+LOGOS.map(l=>'<option value="'+l[0]+'"'+((S.logo||'auto')===l[0]?' selected':'')+'>'+l[1]+'</option>').join('')+'</select></div><button class="big alt" id="rs">Reset all progress</button>');
 $('lg').onchange=e=>{S.logo=e.target.value;save();setLogo()};
 $('hp').onclick=openHelp;
 $('sn').onclick=()=>{S.snd=S.snd?0:1;save();openSet()};
 $('rs').onclick=()=>{$('rs').textContent='Tap again to confirm reset';$('rs').onclick=()=>{S=fresh();S.name='';try{localStorage.removeItem(KEY)}catch(e){}cust=[];closeModal();setScene('title');$('title').style.display='flex';$('cont').style.display='none'}};
}
document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{({yard:openYard,cats:()=>openCats(),upg:openUpg,set:openSet})[b.dataset.m]()});
$('hb').onclick=openHelp;
$('back').onclick=()=>{setScene('shop')};
$('lure').onclick=()=>{if(!Y)return;if(Y.lure==='fish')Y.lure='toy';else if(S.treats>0)Y.lure='fish';else toast('No 🐟 treats — buy some in Upgrades');updLure()};
$('act').addEventListener('pointerdown',e=>{e.preventDefault();act()});
$('pounce').addEventListener('pointerdown',e=>{e.preventDefault();pounce()});
$('cbar').addEventListener('pointerdown',e=>{e.preventDefault();pounce()});

/* ---------- input ---------- */
function toDesign(e){const sc=app._sc;return[(e.clientX-app._ox)/sc,(e.clientY-app._oy)/sc]}
cv.addEventListener('pointerdown',e=>{
 const[x,y]=toDesign(e);
 if(scene==='yard'){if(!C&&$('modal').style.display!=='flex'){P.tx=clamp(x,FX0,FX1);P.ty=clamp(y,FY0,FY1)}return}
 if(scene!=='shop')return;
 for(const u of cust){if(u.st==='wait'&&Math.abs(x-u.x)<34&&y>u.y-150&&y<u.y+5){serve(u);return}}
 for(let i=0;i<S.up.rooms;i++){const id=S.posts[i],p=POSTS[i];if(id==null)continue;if(Math.abs(x-p.x)<34&&y>p.y-80&&y<p.y+8){const k=catBy(id);k.mood=Math.min(100,k.mood+3);popFx(p.x,p.y-90,'❤️','#ff7aa8');sfx(520+Math.random()*80,.08,'sine');return}}
});
const KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d'};
addEventListener('keydown',e=>{if(scene!=='yard'||$('modal').style.display==='flex')return;const k=KM[e.key];if(k){keys[k]=1;e.preventDefault()}else if(e.key===' '||e.key==='e'||e.key==='E'||e.key==='Enter'){e.preventDefault();if(C)pounce();else act()}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=0});

/* ---------- title ---------- */
const LOGOS=[['auto','Auto (by date)'],['summer','Summer'],['christmas','Christmas'],['valentine','Valentine\'s'],['easter','Easter'],['stpatrick','St Patrick\'s'],['spring','Spring'],['halloween','Halloween'],['newyear','New Year'],['autumn','Autumn']];
function autoLogo(){const d=new Date(),m=d.getMonth()+1,n=d.getDate();return m==12?'christmas':m==1?(n<=7?'newyear':'summer'):m==2?(n<=14?'valentine':'summer'):m==3?(n<=17?'stpatrick':'autumn'):m==4?'easter':m==10?'halloween':m==9||m==11?'spring':'autumn'}
function setLogo(){const k=(S.logo&&S.logo!=='auto')?S.logo:autoLogo();$('logoimg').src='logos/'+k+'.webp'}
setLogo();
if(hasSave){$('cont').style.display='block';$('nm').value=S.name}
function begin(){const v=$('nm').value.trim();if(v)S.name=v;$('title').style.display='none';save();cust=[];spawnT=1;setScene('shop');if(!S.helped){S.helped=1;save();openHelp()}}
$('start').onclick=begin;
$('cont').onclick=begin;

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
 const mo=$('modal').style.display==='flex';
 if(scene==='shop'&&!mo)updateShop(dt);
 else if(scene==='yard'&&!mo)updateYard(dt);
 fx.forEach(f=>f.life-=dt);fx=fx.filter(f=>f.life>0);
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,DW,DH);
 if(scene==='yard'&&Y)drawYard();else if(scene==='shop')drawShop();else{ctx.fillStyle='#ffd9e8';ctx.fillRect(0,0,DW,DH)}
 saveT+=dt;if(saveT>5){saveT=0;if(scene!=='title')save()}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__km={S:()=>S,setScene,startYard,Y:()=>Y,P,C:()=>C,act,pounce,openCats,openUpg,openYard,openDress,openHelp,cust:()=>cust,serve,tick:dt=>{updateYard(dt)}};
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
</body>
</html>
