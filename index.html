<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KittyMart</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#171a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KittyMart">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0b1f;font-family:ui-rounded,'Nunito',system-ui,sans-serif;color:#f5ecd8;touch-action:none}
#app{position:absolute;left:0;top:0;width:420px;height:760px;transform-origin:0 0;overflow:hidden}
canvas#c{position:absolute;left:0;top:0;width:420px;height:760px;display:block}
.pill{display:flex;align-items:center;gap:5px;background:rgba(20,16,48,.82);border:2px solid #ffb454;border-radius:999px;padding:3px 12px 3px 6px;font-weight:800;font-size:16px;color:#ffe3a8}
#hud{position:absolute;left:8px;top:8px;right:8px;display:none;gap:8px;align-items:center}
#hud .sp{flex:1}
#nav{position:absolute;left:0;right:0;bottom:8px;display:none;justify-content:center;gap:8px;padding:0 8px}
.nb{flex:1;max-width:96px;height:56px;border-radius:16px;border:2px solid #59d8c6;background:rgba(20,16,48,.9);color:#e8fff9;font:800 12px ui-rounded,system-ui;cursor:pointer;line-height:1.1}
.nb span{display:block;font-size:22px}
.nb:active{transform:scale(.95)}
#creep{position:absolute;left:50%;bottom:26px;width:200px;height:90px;margin-left:-100px;border-radius:45px;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#ffcf80,#e8873a);color:#3a1d00;font:800 20px ui-rounded,system-ui;display:none;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#creep.treat{background:radial-gradient(circle at 35% 30%,#a8f3e6,#2fb7a1)}
#creep.on{transform:scale(.95);filter:brightness(1.15)}
#back{position:absolute;right:8px;top:48px;display:none;border:2px solid #59d8c6;background:rgba(20,16,48,.85);color:#e8fff9;border-radius:14px;padding:6px 12px;font:800 14px ui-rounded,system-ui}
#toast{position:absolute;left:50%;top:200px;transform:translateX(-50%);opacity:0;transition:opacity .3s;pointer-events:none;background:rgba(20,16,48,.92);border:2px solid #ffb454;border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;text-align:center;max-width:380px;z-index:30}
#modal{position:absolute;inset:0;background:rgba(8,6,24,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
#mbox{position:relative;background:#241f3f;border:3px solid #59d8c6;border-radius:22px;width:100%;max-height:92%;overflow:auto;padding:14px 14px 16px;touch-action:pan-y}
#mbox h2{margin:0 0 10px;font-size:22px;color:#ffb454}
#mx{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:#3a3466;color:#fff;font-size:18px}
.row{display:flex;gap:10px;align-items:center;background:#2f2958;border-radius:14px;padding:8px;margin-bottom:8px}
.row canvas{background:#1c1838;border-radius:10px;flex:none}
.meta{flex:1;min-width:0;font-weight:800;font-size:14px}
.meta small{display:block;font-weight:600;opacity:.75;font-size:12px;margin:2px 0}
.meta input,.meta select{font:700 16px ui-rounded,system-ui;width:100%;border:2px solid #4a4380;border-radius:8px;background:#1c1838;color:#fff;padding:3px 6px;margin-top:3px;user-select:text;-webkit-user-select:text}
.mood{height:8px;background:#1c1838;border-radius:4px;overflow:hidden;margin:3px 0}.mood i{display:block;height:100%;background:linear-gradient(90deg,#ff7aa8,#59d8c6)}
.mini{border:0;border-radius:12px;padding:8px 10px;font:800 13px ui-rounded,system-ui;background:#ffb454;color:#3a1d00;cursor:pointer;flex:none}
.mini:disabled{opacity:.4}
.big{display:block;width:100%;margin-top:8px;border:0;border-radius:14px;padding:12px;font:800 17px ui-rounded,system-ui;background:#59d8c6;color:#06322c;cursor:pointer}
.big.alt{background:#ffb454;color:#3a1d00}
.dex{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.dx{text-align:center;font-size:10px;font-weight:700;background:#2f2958;border-radius:10px;padding:2px}
.dx canvas{width:100%;height:auto}.dx.lock canvas{filter:brightness(0) opacity(.45)}
#title{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 25%,#4a3a82 0%,#171a3a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;z-index:25}
#title h1{margin:0;font-size:52px;color:#ffb454;text-shadow:0 0 18px rgba(255,180,84,.7),0 4px 0 #8a4a10}
#title p{margin:0;max-width:320px;font-size:15px;font-weight:600;color:#cfd8ff}
#title input{font:800 18px ui-rounded,system-ui;text-align:center;border:3px solid #59d8c6;border-radius:999px;padding:8px 16px;width:240px;background:#1c1838;color:#fff;user-select:text;-webkit-user-select:text}
.go{font:800 22px ui-rounded,system-ui;border:4px solid #fff;border-radius:999px;padding:10px 40px;color:#3a1d00;background:linear-gradient(#ffd27a,#e8873a);cursor:pointer}
.go.alt{background:linear-gradient(#a8f3e6,#2fb7a1);color:#06322c;font-size:17px;padding:8px 28px}
</style>
</head>
<body>
<div id="app">
 <canvas id="c" width="420" height="760"></canvas>
 <div id="hud"><div class="pill"><canvas id="ci" width="28" height="28"></canvas><span id="coins">0</span></div><div class="pill">🐟 <span id="treats">0</span></div><div class="sp"></div><div class="pill" id="day">Day 1</div></div>
 <button id="back">🏠 Home</button>
 <div id="nav">
  <button class="nb" data-m="hunt"><span>🌙</span>Night Stroll</button>
  <button class="nb" data-m="cats"><span>🐱</span>Cat-alog</button>
  <button class="nb" data-m="upg"><span>🛒</span>Upgrades</button>
  <button class="nb" data-m="set"><span>⚙️</span>Settings</button>
 </div>
 <button id="creep">🐾 Hold to creep</button>
 <div id="toast"></div>
 <div id="modal"><div id="mbox"><button id="mx">✕</button><div id="mc"></div></div></div>
 <div id="title">
  <img id="logoimg" alt="KittyMart" width="330" height="330" style="width:330px;height:330px;border-radius:28px;box-shadow:0 8px 28px rgba(0,0,0,.45);object-fit:cover">
  <p>Run the coziest night-market shop. Sneak up on shy strays. Never make eye contact.</p>
  <input id="nm" type="text" maxlength="14" placeholder="Shopkeeper name" autocomplete="off">
  <button class="go" id="start">Open for business</button>
  <button class="go alt" id="cont" style="display:none">Continue</button>
 </div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),app=$('app');
const DW=420,DH=760;
function fit(){const sc=Math.min(innerWidth/DW,innerHeight/DH);app.style.transform='translate('+(innerWidth-DW*sc)/2+'px,'+(innerHeight-DH*sc)/2+'px) scale('+sc+')';app._sc=sc;app._ox=(innerWidth-DW*sc)/2;app._oy=(innerHeight-DH*sc)/2}
addEventListener('resize',fit);fit();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>clamp(v+amt,0,255);return 'rgb('+f(n>>16)+','+f((n>>8)&255)+','+f(n&255)+')'}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,6.2832)}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* ---------- data ---------- */
const COATS=[
{id:'ginger',n:'Ginger Tabby',r:0,base:'#e8964a',pat:'tabby',pc:'#b9672a',belly:'#fff0d8'},
{id:'smoke',n:'Smoky Tabby',r:0,base:'#8d93a3',pat:'tabby',pc:'#5c6273',belly:'#e3e6ee'},
{id:'shadow',n:'Shadow Black',r:0,base:'#2e2b38',pat:'solid',pc:'#2e2b38',belly:'#45415a'},
{id:'cloud',n:'Cloud White',r:0,base:'#f6f3ee',pat:'solid',pc:'#e5dfd6',belly:'#ffffff'},
{id:'tux',n:'Tuxedo',r:1,base:'#2b2a35',pat:'tux',pc:'#ffffff',belly:'#ffffff'},
{id:'calico',n:'Calico',r:1,base:'#fbf4e8',pat:'calico',pc:'#e8964a',pc2:'#3a3541',belly:'#ffffff'},
{id:'siamese',n:'Siamese',r:1,base:'#f2e1c6',pat:'point',pc:'#6b4a3a',belly:'#fff4e0'},
{id:'bengal',n:'Golden Bengal',r:2,base:'#e3b050',pat:'spots',pc:'#7a4a1e',belly:'#fff3d0'},
{id:'starry',n:'Starry Night',r:2,base:'#25244a',pat:'stars',pc:'#ffe9a0',belly:'#34336a'}];
const COAT={};COATS.forEach(k=>COAT[k.id]=k);
const EYES=['#6fd0a0','#f2c14e','#5db7e8','#e8a04a'],COLLARS=['#e85d75','#5db7e8','#f2c14e','#7bd389'];
const NAMES=['Miso','Pixel','Noodle','Biscuit','Mochi','Pepper','Waffles','Luna','Tofu','Ziggy','Olive','Nutmeg','Sprout','Pudding','Clove','Fig'];
const DIST=[
{id:'alley',n:'Back Alley',e:'🧱',cost:0,sky:['#171a3a','#4a3260'],perch:'crate',pool:['ginger','smoke','shadow','cloud','ginger','smoke','tux','calico']},
{id:'pier',n:'Fish Pier',e:'⚓',cost:150,sky:['#0c2a3e','#2a6a78'],perch:'barrel',pool:['smoke','shadow','cloud','tux','calico','siamese','siamese','bengal']},
{id:'roof',n:'Rooftops',e:'🌙',cost:400,sky:['#080a26','#2a2160'],perch:'chimney',pool:['tux','calico','siamese','bengal','bengal','starry','starry','shadow']}];
const ITEMS=[{e:'🐟',p:6},{e:'🧶',p:9},{e:'🥫',p:12},{e:'🧸',p:16},{e:'🎀',p:24}];
const POSTS=[{n:'Counter greeter',d:'+25% tips',x:300,y:480},{n:'Window sunbather',d:'Customers arrive faster',x:90,y:282},{n:'Shelf napper',d:'Customers wait longer',x:372,y:282},{n:'Floor mouser',d:'Serves a customer every 9s',x:120,y:655}];
const QX=[300,230,160],FLOORY=612,TREAT=6;

/* ---------- state ---------- */
const KEY='kittymart-v1';
const fresh=()=>({name:'',coins:40,treats:5,cats:[],posts:[null,null,null,null],up:{shelf:0,neon:0,heat:0,rooms:2},seen:{},dist:{alley:1},served:0,nid:1,snd:1});
let S=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object'){S=Object.assign(fresh(),s);S.up=Object.assign(fresh().up,s.up||{});S.dist=Object.assign({alley:1},s.dist||{})}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let hasSave=false;try{hasSave=!!localStorage.getItem(KEY)&&!!S.name}catch(e){}

/* ---------- sound ---------- */
let AC=null;
function sfx(f,d,type,v,delay){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(delay||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}

/* ---------- cat drawing ---------- */
function star(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr_=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rr_,y+Math.sin(a)*rr_)}c.closePath();c.fill()}
function drawCat(c,x,y,o){
 const K=COAT[o.coat],s=o.s||1,t=o.t||0,m=o.mood||'idle',eye=o.eye||'#6fd0a0';
 c.save();c.translate(x,y);c.scale(s,s);if(o.alpha!=null)c.globalAlpha=o.alpha;
 c.fillStyle='rgba(0,0,0,.28)';ell(c,0,2,36,8);c.fill();
 const tw=Math.sin(t*3)*(m==='watch'?2:9),tc=K.pat==='point'?K.pc:K.base;
 c.strokeStyle=tc;c.lineWidth=10;c.lineCap='round';c.beginPath();c.moveTo(20,-8);c.bezierCurveTo(54,-6,62,-44+tw,42,-58+tw);c.stroke();
 if(K.pat==='tabby'){c.strokeStyle=K.pc;c.setLineDash([5,7]);c.stroke();c.setLineDash([])}
 if(K.pat==='tux'){c.strokeStyle='#fff';c.lineWidth=10;c.beginPath();c.moveTo(42,-58+tw);c.lineTo(42,-58+tw);c.stroke()}
 const bg=c.createLinearGradient(0,-66,0,0);bg.addColorStop(0,K.base);bg.addColorStop(1,shade(K.base,-18));
 c.fillStyle=bg;c.beginPath();c.moveTo(-20,-4);c.bezierCurveTo(-36,-4,-30,-64,0,-66);c.bezierCurveTo(30,-64,36,-4,20,-4);c.closePath();c.fill();
 c.save();c.clip();
 if(K.pat==='tabby'){c.strokeStyle=K.pc;c.lineWidth=4;for(let i=0;i<4;i++){c.beginPath();c.moveTo(-36,-16-i*12);c.lineTo(-20,-14-i*12);c.moveTo(36,-16-i*12);c.lineTo(20,-14-i*12);c.stroke()}}
 if(K.pat==='calico'){c.fillStyle=K.pc;ell(c,-20,-40,14,16);c.fill();c.fillStyle=K.pc2;ell(c,18,-22,12,14);c.fill()}
 if(K.pat==='spots'){c.fillStyle=K.pc;[[-18,-44],[16,-50],[-6,-26],[20,-30],[-22,-18],[4,-56]].forEach(p=>{ell(c,p[0],p[1],5,4);c.fill()})}
 if(K.pat==='stars'){c.fillStyle=K.pc;[[-16,-46],[14,-52],[-4,-26],[18,-24],[-20,-20]].forEach((p,i)=>star(c,p[0],p[1],3+(i%2)))}
 c.fillStyle=K.pat==='tux'?'#fff':K.belly;c.globalAlpha=(o.alpha!=null?o.alpha:1)*(K.pat==='tux'?1:.75);ell(c,0,-26,13,24);c.fill();c.globalAlpha=o.alpha!=null?o.alpha:1;
 c.restore();
 if(o.apron){c.fillStyle='#2fb7a1';c.beginPath();c.moveTo(-14,-52);c.lineTo(14,-52);c.lineTo(20,-6);c.lineTo(-20,-6);c.closePath();c.fill();c.fillStyle='#1f8f7d';rr(c,-9,-26,18,12,3);c.fill();c.strokeStyle='#2fb7a1';c.lineWidth=3;c.beginPath();c.moveTo(-10,-54);c.lineTo(-4,-62);c.moveTo(10,-54);c.lineTo(4,-62);c.stroke()}
 const pawc=K.pat==='tux'?'#fff':K.pat==='point'?K.pc:K.base;
 c.fillStyle=pawc;ell(c,-12,-4,10,6);c.fill();ell(c,12,-4,10,6);c.fill();
 if(o.collar){c.strokeStyle=o.collar;c.lineWidth=5;c.beginPath();c.arc(0,-52,15,.35,2.8);c.stroke();c.fillStyle='#ffd35c';c.beginPath();c.arc(0,-37,4,0,6.3);c.fill()}
 // head
 const hy=-76,tell=m==='tell';
 const ear=(sx,col,rot)=>{c.save();c.translate(sx*24,hy-6);c.rotate(rot);c.fillStyle=col;c.beginPath();c.moveTo(-sx*4,0);c.lineTo(sx*2,-32);c.lineTo(sx*20,-4);c.closePath();c.fill();c.fillStyle='#ffb3c7';c.beginPath();c.moveTo(sx*2,-4);c.lineTo(sx*5,-22);c.lineTo(sx*14,-5);c.closePath();c.fill();c.restore()};
 const twitch=tell?Math.sin(t*40)*.25:0;
 const lc=K.pat==='point'?K.pc:K.pat==='calico'?K.pc:K.base,rc=K.pat==='point'?K.pc:K.pat==='calico'?K.pc2:K.base;
 ear(-1,lc,-twitch);ear(1,rc,twitch);
 const hg=c.createRadialGradient(-6,hy-8,4,0,hy,30);hg.addColorStop(0,shade(K.base,16));hg.addColorStop(1,K.base);
 c.fillStyle=hg;ell(c,0,hy,29,25);c.fill();
 c.save();c.clip();
 if(K.pat==='tabby'){c.strokeStyle=K.pc;c.lineWidth=3;c.beginPath();[-7,0,7].forEach(x=>{c.moveTo(x,hy-26);c.lineTo(x,hy-14)});c.moveTo(-29,hy+2);c.lineTo(-20,hy+4);c.moveTo(29,hy+2);c.lineTo(20,hy+4);c.moveTo(-29,hy+10);c.lineTo(-20,hy+9);c.moveTo(29,hy+10);c.lineTo(20,hy+9);c.stroke()}
 if(K.pat==='tux'){c.fillStyle='#fff';ell(c,0,hy+11,14,11);c.fill();c.beginPath();c.moveTo(-3,hy-25);c.lineTo(3,hy-25);c.lineTo(2,hy+2);c.lineTo(-2,hy+2);c.fill()}
 if(K.pat==='calico'){c.fillStyle=K.pc;ell(c,-18,hy-8,14,13);c.fill();c.fillStyle=K.pc2;ell(c,20,hy-12,10,10);c.fill()}
 if(K.pat==='point'){c.fillStyle=K.pc;c.globalAlpha=.9;ell(c,0,hy+6,17,14);c.fill()}
 if(K.pat==='spots'){c.fillStyle=K.pc;[[-18,hy-10],[18,hy-12],[-22,hy+6],[0,hy-20]].forEach(p=>{ell(c,p[0],p[1],4,3);c.fill()})}
 if(K.pat==='stars'){c.fillStyle=K.pc;[[-18,hy-10],[18,hy-14],[0,hy-20],[22,hy+4]].forEach((p,i)=>star(c,p[0],p[1],3))}
 c.restore();
 // eyes
 const ex=[-11,11];
 ex.forEach(x=>{
  if(m==='groom'||(m==='idle'&&((t*.7+(o.ph||0))%4)<.14)){c.strokeStyle='#201a30';c.lineWidth=2.5;c.beginPath();c.arc(x,hy-1,5,.15,Math.PI-.15);c.stroke()}
  else if(m==='happy'){c.strokeStyle='#201a30';c.lineWidth=2.5;c.beginPath();c.arc(x,hy+2,5,Math.PI+.2,-.2);c.stroke()}
  else{const big=m==='watch',r=big?8:6.5;c.fillStyle='#fff';ell(c,x,hy-1,r+1.5,r+1.5);c.fill();c.fillStyle=eye;ell(c,x,hy-1,r,r);c.fill();c.fillStyle='#201a30';if(big)ell(c,x,hy-1,r*.62,r*.62);else ell(c,x,hy-1,2.2,r*.85);c.fill();c.fillStyle='#fff';ell(c,x+2,hy-4,1.8,1.8);c.fill()}
 });
 c.fillStyle='#ff8fae';c.beginPath();c.moveTo(-3.5,hy+8);c.lineTo(3.5,hy+8);c.lineTo(0,hy+12);c.closePath();c.fill();
 c.strokeStyle=K.id==='cloud'?'#8a7f8f':'#201a30';c.lineWidth=1.6;c.beginPath();c.moveTo(0,hy+12);c.lineTo(0,hy+14);c.moveTo(-6,hy+14);c.quadraticCurveTo(-3,hy+19,0,hy+14);c.quadraticCurveTo(3,hy+19,6,hy+14);c.stroke();
 c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=1.2;c.beginPath();[-1,1].forEach(sx=>{[-3,3].forEach(dy=>{c.moveTo(sx*13,hy+10+dy);c.lineTo(sx*36,hy+8+dy*2.2)})});c.stroke();
 if(m==='groom'){c.fillStyle=pawc;ell(c,17,hy+9+Math.sin(t*7)*3,8,7);c.fill()}
 c.restore();
}
function drawCoin(c,x,y,r){c.save();c.translate(x,y);c.fillStyle='#e8a82a';c.beginPath();c.moveTo(-r*.85,-r*.2);c.lineTo(-r*.7,-r*1.15);c.lineTo(-r*.1,-r*.8);c.lineTo(r*.1,-r*.8);c.lineTo(r*.7,-r*1.15);c.lineTo(r*.85,-r*.2);c.fill();
 const g=c.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);g.addColorStop(0,'#ffe68a');g.addColorStop(1,'#e8a82a');c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,6.3);c.fill();c.strokeStyle='#a8661a';c.lineWidth=r*.12;c.stroke();
 c.fillStyle='#8a4a10';c.font='800 '+(r*1.3)+'px ui-rounded,system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('$',0,r*.08);c.restore()}
function paint(cvs,fn){const c=cvs.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cvs.width,cvs.height);fn(c,cvs.width,cvs.height)}
drawCoin($('ci').getContext('2d'),14,15,11);

/* ---------- game state ---------- */
let scene='title',time=0,cust=[],fx=[],spawnT=2,mouseT=0,cid=0,saveT=0,H=null;
const catBy=id=>S.cats.find(c=>c.id===id);
function worker(i){const id=S.posts[i];if(id==null||i>=S.up.rooms)return null;const c=catBy(id);return c&&c.mood>=25?c:null}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2200)}
function refresh(){$('coins').textContent=S.coins;$('treats').textContent=S.treats;$('day').textContent='Day '+(Math.floor(S.served/20)+1)}

function serve(u,auto){
 if(u.st!=='wait')return;const it=ITEMS[u.want];let gain=it.p*(1+(worker(0)?.25:0));gain=Math.round(gain);
 S.coins+=gain;S.served++;u.st='leave';u.happy=true;popFx(u.x,u.y-110,'+'+gain);sfx(880,.12,'triangle');sfx(1175,.15,'triangle',.05,.08);refresh();
}
function waiting(){return cust.filter(u=>u.st==='wait')}

 const heat=S.up.heat;
 S.posts.forEach((id,i)=>{if(id==null||i>=S.up.rooms)return;const c=catBy(id);if(c&&c.mood>0)c.mood=Math.max(0,c.mood-dt/(6*(1+.4*heat)))});
 S.cats.forEach(c=>{if(!S.posts.includes(c.id))c.mood=Math.min(100,c.mood+dt*.1)});
 spawnT-=dt;if(spawnT<=0){spawnCust();spawnT=5.5*(1-.12*S.up.neon)*(worker(1)?.8:1)*rnd(.7,1.3)}
 if(worker(3)){mouseT+=dt;if(mouseT>=9){mouseT=0;const w=waiting()[0];if(w){serve(w,true);popFx(POSTS[3].x,POSTS[3].y-60,'🐭','#fff')}}}else mouseT=0;
 const act=cust.filter(u=>u.st==='in'||u.st==='wait');
 act.forEach((u,i)=>{const tx=QX[Math.min(i,2)];const d=tx-u.x;if(Math.abs(d)>2){u.x+=Math.sign(d)*Math.min(Math.abs(d),70*dt);u.st='in';u.walk=true}else{u.st='wait';u.walk=false}});
 cust.forEach(u=>{
  if(u.st==='wait'){u.pat-=dt/(18*(worker(2)?1.5:1));if(u.pat<=0){u.st='leave';u.happy=false;popFx(u.x,u.y-110,'😾','#fff')}}

 });
 cust=cust.filter(u=>u.x>-60);
}

function startHunt(di){
 const D=DIST[di];if(S.treats<1){toast('You need a 🐟 treat — buy some in Upgrades');return}
 const coat=pick(D.pool),K=COAT[coat];
 H={di,D,coat,eye:pick(EYES),d:100,alert:0,st:'groom',t:rnd(1.5,2.5),hold:false,res:null,rt:0,ph:Math.random()*5,x:0};
 closeModal();setScene('hunt');$('creep').className='';$('creep').textContent='🐾 Hold to creep';
 if(!S.tut){S.tut=1;toast('Creep while it grooms 😌 — freeze when it watches 👀')}
}
function updateHunt(dt){
 if(!H)return;const r=COAT[H.coat].r;
 if(H.res==='fled'){H.x+=420*dt;H.rt+=dt;if(H.rt>1.1&&!H.shown){H.shown=1;endHunt(false)}return}
 if(H.res==='won'){H.rt+=dt;return}
 H.t-=dt;
 if(H.t<=0){if(H.st==='groom'){H.st='tell';H.t=Math.max(.3,.55-.1*r)}else if(H.st==='tell'){H.st='watch';H.t=rnd(.9,1.7)+.15*r}else{H.st='groom';H.t=Math.max(.9,rnd(1.7,3.2)-.5*r)}}
 if(H.res==='close'){return}
 if(H.hold){if(H.st==='watch'){H.alert+=70*dt}else{H.d-=17*dt;if(H.st==='tell')H.alert+=12*dt;else H.alert=Math.max(0,H.alert-8*dt)}}
 else H.alert=Math.max(0,H.alert-30*dt);
 if(H.alert>=100){H.res='fled';H.rt=0;H.hold=false;sfx(160,.35,'sawtooth',.05);$('creep').className='';$('creep').textContent='💨'}
 else if(H.d<=8){H.d=8;H.res='close';H.hold=false;$('creep').className='treat';$('creep').textContent='🐟 Offer treat';sfx(660,.1,'triangle')}
}
function offer(){
 if(!H||H.res!=='close')return;
 H.res='won';H.rt=0;S.treats--;const K=COAT[H.coat];
 const cat={id:S.nid++,coat:H.coat,eye:H.eye,collar:pick(COLLARS),name:pick(NAMES),mood:100};S.cats.push(cat);S.seen[H.coat]=1;
 const bonus=[10,25,60][K.r];S.coins+=bonus;refresh();save();
 [523,659,784,1047].forEach((f,i)=>sfx(f,.2,'triangle',.06,i*.1));
 setTimeout(()=>{
  modal('<h2>New friend! 💕</h2><div style="text-align:center"><canvas id="np" width="200" height="190"></canvas><div style="font-weight:800">'+K.n+' · '+['Common','Uncommon','Rare'][K.r]+'</div><small>+'+bonus+' 🪙 welcome bonus</small></div><div class="meta" style="margin-top:8px">Name your cat<input type="text" id="nn" maxlength="12" value="'+esc(cat.name)+'"></div><button class="big" id="ok">Welcome to the shop</button><button class="big alt" id="again">Another stroll</button>');
  paint($('np'),(c,w,h)=>{c.translate(w/2,h-10);drawCat(c,0,0,{coat:cat.coat,eye:cat.eye,collar:cat.collar,s:1.4,t:0,mood:'happy'})});
  const fin=()=>{const v=$('nn').value.trim();if(v)cat.name=v.slice(0,12);save()};
  $('ok').onclick=()=>{fin();closeModal();H=null;setScene('shop')};
  $('again').onclick=()=>{fin();const di=H.di;H=null;startHunt(di)};
 },1100);
}
function endHunt(won){
 modal('<h2>It slipped away 💨</h2><p>You moved while it was watching. Strays are shy — creep only while it grooms, and freeze at the ear-twitch warning.</p><button class="big" id="try">Try again</button><button class="big alt" id="home">Back to shop</button>');

}

function openUpg(){
 let h='<h2>Shop upgrades</h2><div class="row"><div class="meta">🐟 Fish treats ×'+S.treats+'<small>'+TREAT+' 🪙 each — one is used to befriend a stray</small></div><button class="mini" data-t="1"'+(S.coins<TREAT*3?' disabled':'')+'>Buy ×3 · '+TREAT*3+'🪙</button></div>';
 upgList().forEach((x,i)=>{const maxed=x.lv>=x.max;h+='<div class="row"><div class="meta">'+x.n+' <small>'+x.d+' · Lv '+x.lv+'/'+x.max+'</small></div><button class="mini" data-u="'+i+'"'+(maxed||S.coins<x.cost?' disabled':'')+'>'+(maxed?'Maxed':x.cost+'🪙')+'</button></div>'});
 modal(h);const mb=$('mbox');
 mb.querySelector('[data-t]').onclick=()=>{if(S.coins<TREAT*3)return;S.coins-=TREAT*3;S.treats+=3;sfx(700,.1,'triangle');refresh();save();openUpg()};
 mb.querySelectorAll('[data-u]').forEach(e=>e.onclick=()=>{const x=upgList()[+e.dataset.u];if(x.lv>=x.max||S.coins<x.cost)return;S.coins-=x.cost;x.buy();sfx(1000,.15,'triangle');refresh();save();openUpg()});
}
function openHunt(){
 let h='<h2>Night Stroll 🌙</h2><p style="margin:0 0 8px;font-size:14px">Creep up on a shy stray while it grooms. Freeze when it watches. Costs one 🐟 treat when you befriend it ('+S.treats+' left).</p>';
 DIST.forEach((D,i)=>{const own=S.dist[D.id];h+='<div class="row"><div style="font-size:30px">'+D.e+'</div><div class="meta">'+D.n+'<small>'+(i===0?'Common & uncommon strays':i===1?'Siamese & Bengal appear':'Starry Night cats prowl here')+'</small></div><button class="mini" data-d="'+i+'"'+(!own&&S.coins<D.cost?' disabled':'')+'>'+(own?'Go':'Unlock '+D.cost+'🪙')+'</button></div>'});
 modal(h);
 $('mbox').querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{const i=+e.dataset.d,D=DIST[i];if(!S.dist[D.id]){if(S.coins<D.cost)return;S.coins-=D.cost;S.dist[D.id]=1;refresh();save();openHunt();return}startHunt(i)});
}
function openSet(){
 modal('<h2>Settings</h2><div class="row"><div class="meta">Sound<small>Little beeps and chimes</small></div><button class="mini" id="sn">'+(S.snd?'On':'Off')+'</button></div><div class="row"><div class="meta">Shop: '+esc(S.name||'KittyMart')+'<small>'+S.served+' customers served · '+S.cats.length+' cats</small></div></div><div class="row"><div class="meta">Title logo<small>Seasonal KittyMart art</small></div><select id="lg">'+LOGOS.map(l=>'<option value="'+l[0]+'"'+((S.logo||'auto')===l[0]?' selected':'')+'>'+l[1]+'</option>').join('')+'</select></div><button class="big alt" id="rs">Reset all progress</button>');
 $('lg').onchange=e=>{S.logo=e.target.value;save();setLogo()};
 $('sn').onclick=()=>{S.snd=S.snd?0:1;save();openSet()};
 $('rs').onclick=()=>{$('rs').textContent='Tap again to confirm reset';$('rs').onclick=()=>{S=fresh();S.name='';try{localStorage.removeItem(KEY)}catch(e){}cust=[];closeModal();setScene('title');$('cont').style.display='none'}};
}
document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{({hunt:openHunt,cats:openCats,upg:openUpg,set:openSet})[b.dataset.m]()});
$('back').onclick=()=>{H=null;setScene('shop')};

/* ---------- input ---------- */
function toDesign(e){const sc=app._sc;return[(e.clientX-app._ox)/sc,(e.clientY-app._oy)/sc]}
cv.addEventListener('pointerdown',e=>{
 if(scene!=='shop')return;const[x,y]=toDesign(e);
 for(const u of cust){if(u.st==='wait'&&Math.abs(x-u.x)<34&&y>u.y-150&&y<u.y+5){serve(u);return}}
 for(let i=0;i<S.up.rooms;i++){const id=S.posts[i],p=POSTS[i];if(id==null)continue;if(Math.abs(x-p.x)<34&&y>p.y-80&&y<p.y+8){const k=catBy(id);k.mood=Math.min(100,k.mood+3);popFx(p.x,p.y-90,'❤️','#ff7aa8');sfx(520+Math.random()*80,.08,'sine');return}}
});
const cb=$('creep');
cb.addEventListener('pointerdown',e=>{e.preventDefault();if(!H)return;if(H.res==='close'){offer();return}if(!H.res){H.hold=true;cb.classList.add('on')}});
['pointerup','pointercancel','pointerleave'].forEach(n=>cb.addEventListener(n,()=>{if(H)H.hold=false;cb.classList.remove('on')}));

/* ---------- title ---------- */
const LOGOS=[['auto','Auto (by date)'],['summer','Summer'],['christmas','Christmas'],['valentine','Valentine\'s'],['easter','Easter'],['stpatrick','St Patrick\'s'],['spring','Spring'],['halloween','Halloween'],['newyear','New Year'],['autumn','Autumn']];
function autoLogo(){const d=new Date(),m=d.getMonth()+1,n=d.getDate();return m==12?'christmas':m==1?(n<=7?'newyear':'summer'):m==2?(n<=14?'valentine':'summer'):m==3?(n<=17?'stpatrick':'autumn'):m==4?'easter':m==10?'halloween':m==9||m==11?'spring':'autumn'}
function setLogo(){const k=(S.logo&&S.logo!=='auto')?S.logo:autoLogo();$('logoimg').src='logos/'+k+'.webp'}
setLogo();
if(hasSave){$('cont').style.display='block';$('nm').value=S.name}
function begin(){const v=$('nm').value.trim();if(v)S.name=v;$('title').style.display='none';save();cust=[];spawnT=1;setScene('shop')}
$('start').onclick=()=>{if(hasSave&&!confirm0()){return}begin()};
function confirm0(){return true}
$('cont').onclick=begin;

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
 if(scene==='shop'&&$('modal').style.display!=='flex')updateShop(dt);
 else if(scene==='hunt'&&$('modal').style.display!=='flex')updateHunt(dt);
 fx.forEach(f=>f.life-=dt);fx=fx.filter(f=>f.life>0);
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,DW,DH);
 if(scene==='hunt'&&H)drawHunt();else if(scene==='shop')drawShop();
 saveT+=dt;if(saveT>5){saveT=0;if(scene!=='title')save()}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__km={S:()=>S,setScene,startHunt,openCats,openUpg,openHunt,H:()=>H,serve,cust:()=>cust};
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
</body>
</html>
